<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fliesenreich</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e5aa8">
<link rel="stylesheet" href="style.css?v=34">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="res">
    <button class="hud-resource" data-hud-resource="gold" aria-label="Gold im Warehouse anzeigen">🪙 <b id="r-gold">0</b></button>
    <button class="hud-resource" data-hud-resource="holz" aria-label="Holz im Warehouse anzeigen">🪵 <b id="r-holz">0</b></button>
    <button class="hud-resource" data-hud-resource="korn" aria-label="Korn im Warehouse anzeigen">🌾 <b id="r-korn">0</b></button>
    <button class="hud-resource" data-hud-resource="werkzeug" aria-label="Werkzeuge im Warehouse anzeigen">🔨 <b id="r-werkzeug">0</b></button>
    <button class="hud-resource" data-hud-resource="forschung" aria-label="Forschungspunkte im Warehouse anzeigen">🔬 <b id="r-forschung">0</b></button>
    <span title="Zeit bis zur nächsten Ausbreitung">🏴 <b id="r-banditen">5:00</b></span>
  </div>
  <div id="actions">
    <div id="primary-actions">
      <button id="btn-full" aria-label="Vollbild" title="Vollbild"><span class="action-icon" aria-hidden="true">⛶</span><span class="action-label">Vollbild</span></button>
      <button id="btn-cards" aria-label="Inventar" title="Inventar"><span class="action-icon" aria-hidden="true">🎒</span><span id="btn-cards-label" class="action-label">Inventar</span></button>
      <button id="btn-workshop" aria-label="Workshop" title="Workshop"><span class="action-icon" aria-hidden="true">🛠️</span><span class="action-label">Workshop</span></button>
      <button id="btn-research" aria-label="Forschung" title="Forschung"><span class="action-icon" aria-hidden="true">🔬</span><span class="action-label">Forschung</span></button>
      <button id="btn-warehouse" aria-label="Warehouse" title="Warehouse"><span class="action-icon" aria-hidden="true">🏚️</span><span class="action-label">Warehouse</span></button>
      <button id="btn-catalog" aria-label="Karten-Browser" title="Alle Karten ansehen"><span class="action-icon" aria-hidden="true">📖</span><span class="action-label">Karten</span></button>
      <button id="btn-archive" aria-label="Archiv" title="Archiv"><span class="action-icon" aria-hidden="true">📜</span><span class="action-label">Archiv</span></button>
    </div>
    <button id="primary-toggle" aria-expanded="false" aria-controls="primary-actions" aria-label="Menü öffnen" title="Menü öffnen">❯</button>
    <div id="tool-actions">
      <button id="btn-grid" aria-label="Grid umschalten" aria-pressed="false" title="Raster außerhalb des Baumodus anzeigen"><span class="action-icon" aria-hidden="true">▦</span><span class="action-label">Grid</span></button>
      <button id="btn-clusters" aria-label="Produktionsketten hervorheben" aria-pressed="true" title="Gelbe Rahmen um Produktionsketten ein- oder ausblenden"><span class="action-icon" aria-hidden="true">🔗</span><span class="action-label">Produktionsketten</span></button>
      <button id="btn-shields" aria-label="Schutz anzeigen" aria-pressed="false" title="Schutz auf Tiles anzeigen"><span class="action-icon" aria-hidden="true">🛡️</span><span class="action-label">Schutz</span></button>
      <button id="btn-follow" aria-label="Zu neuen Tiles springen" aria-pressed="false" title="Kamera springt nach dem Erstellen zum neuen Tile"><span class="action-icon" aria-hidden="true">🎯</span><span class="action-label">Folgen</span></button>
      <button id="btn-filter" aria-label="Tile-Filter öffnen" aria-haspopup="dialog" title="Tile-Filter öffnen"><span class="action-icon" aria-hidden="true">🔎</span><span class="action-label">Filter</span></button>
      <button id="filter-clear" aria-label="Filter ausschalten" title="Filter ausschalten" hidden>✕</button>
      <button id="btn-shop" aria-label="Shop" title="Shop"><span class="action-icon" aria-hidden="true">🪙</span><span id="btn-shop-label" class="action-label">Shop</span></button>
      <button id="btn-new-game" aria-label="Neues Spiel" title="Neues Spiel"><span class="action-icon" aria-hidden="true">🔄</span><span class="action-label">Neues Spiel</span></button>
      <button id="btn-shuffle" aria-label="Deck mischen" title="Deck mischen"><span class="action-icon" aria-hidden="true">🔀</span><span id="btn-shuffle-label" class="action-label">5🪙</span></button>
    </div>
    <div id="queue-wrap">
      <button id="queue" aria-label="Nächste Karte ziehen"></button>
      <button id="btn-delete-card" aria-label="Nächste Karte löschen" title="Nächste Karte löschen">🗑️ Löschen · +10🪙</button>
    </div>
  </div>
</div>

<div id="panel" class="hidden">
  <div id="panel-info"></div>
  <button id="btn-return-card" hidden>Ans Deckende</button>
  <button id="btn-cancel-move" hidden>Abbrechen</button>
</div>

<aside id="crafting-panel" class="closed" aria-label="Laufende Herstellungsaufträge">
  <div id="crafting-content" inert>
    <b>🛠️ Laufende Herstellung</b>
    <div id="crafting-jobs"></div>
  </div>
  <button id="crafting-toggle" aria-expanded="false" aria-controls="crafting-content" aria-label="Herstellungsübersicht öffnen">❯</button>
</aside>

<button id="ready-packs" hidden aria-label="Fertige Packs öffnen" title="Fertige Packs öffnen">📦 <span id="ready-packs-count"></span></button>

<div id="tile-popup" class="hidden"></div>

<div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title"><div id="overlay-box"><div id="overlay-head"><b id="overlay-title"></b><button id="overlay-close" aria-label="Fenster schließen">✕</button></div><div id="overlay-body"></div></div></div>

<div id="toast"></div>
<button id="undo-move" hidden></button>
<div id="rotate">Bitte Handy ins Querformat drehen 🔄</div>

<script type="module" src="src/main.js?v=61"></script>
</body>
</html>
