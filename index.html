<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fliesenreich</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e5aa8">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="res">
    <button class="hud-resource" data-hud-resource="gold" aria-label="Gold im Warehouse anzeigen">🪙 <b id="r-gold">0</b></button>
    <button class="hud-resource" data-hud-resource="holz" aria-label="Holz im Warehouse anzeigen">🪵 <b id="r-holz">0</b></button>
    <button class="hud-resource" data-hud-resource="korn" aria-label="Korn im Warehouse anzeigen">🌾 <b id="r-korn">0</b></button>
    <span title="Zeit bis zur nächsten Ausbreitung">🏴 <b id="r-banditen">5:00</b></span>
  </div>
  <div id="actions">
    <button id="btn-full">⛶</button>
    <button id="btn-cards">Inventar</button>
    <button id="btn-workshop">Workshop</button>
    <button id="btn-warehouse">Warehouse</button>
    <button id="btn-archive">Archiv</button>
    <button id="btn-grid" aria-pressed="false" title="Raster außerhalb des Baumodus anzeigen">▦ Grid</button>
    <button id="btn-shields" aria-pressed="false" title="Schutz auf Tiles anzeigen">🛡️ Schutz</button>
    <button id="btn-shop">Shop</button>
    <button id="btn-new-game">Neues Spiel</button>
    <button id="btn-shuffle">🔀</button>
    <span id="next-control">
      <button id="btn-next">Next</button>
      <div id="queue" aria-label="Nächste Karte"></div>
    </span>
  </div>
</div>

<div id="panel" class="hidden">
  <div id="panel-info"></div>
  <button id="btn-return-card" hidden>Ans Deckende</button>
</div>

<aside id="crafting-panel" class="closed" aria-label="Laufende Herstellungsaufträge">
  <div id="crafting-content" inert>
    <b>🛠️ Laufende Herstellung</b>
    <div id="crafting-jobs"></div>
  </div>
  <button id="crafting-toggle" aria-expanded="false" aria-controls="crafting-content" aria-label="Herstellungsübersicht öffnen">❯</button>
</aside>

<button id="idle-workshop" hidden aria-label="Untätige Workshops anzeigen" title="Untätige Workshops anzeigen">🛠️ <span id="idle-workshop-count"></span></button>
<button id="ready-packs" hidden aria-label="Fertige Packs öffnen" title="Fertige Packs öffnen">📦 <span id="ready-packs-count"></span></button>

<div id="tile-popup" class="hidden"></div>

<div id="overlay" class="hidden"><div id="overlay-box"><div id="overlay-head"><b id="overlay-title"></b><button id="overlay-close">✕</button></div><div id="overlay-body"></div></div></div>

<div id="toast"></div>
<div id="rotate">Bitte Handy ins Querformat drehen 🔄</div>

<script type="module" src="src/main.js?v=28"></script>
</body>
</html>
